name: Bug report
description: Report a reproducible problem in the Companion, firmware, protocol, or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please remove Wi-Fi passwords, pairing keys, profile exports, and personal logs before posting.
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "d833ada or 0.1.0"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware and OS
      placeholder: "Waveshare Rev1.1 / macOS 14.6"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or test output
      description: Redact credentials, pairing data, private paths, and personal data.
